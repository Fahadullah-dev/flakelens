[project]
name = "flakelens"
version = "0.2.0"
description = "Local-first flaky test detection over JUnit XML and TAP, exposed as an MCP server and a pytest plugin"
requires-python = ">=3.10"
dependencies = ["mcp>=2.0", "junitparser>=5.0", "tap.py>=3.2"]

[project.optional-dependencies]
dev = ["pytest"]

[project.entry-points.pytest11]
flakelens = "flakelens.pytest_plugin"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flakelens*"]
